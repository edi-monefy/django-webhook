---
name: Publish to PyPI

on:
  push:
    tags:
      # Publish on version tags, with or without a leading "v".
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-webhook2/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Verify the tag matches pyproject.toml
        run: |
          # Strip an optional leading "v" (v1.2.3 -> 1.2.3).
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(poetry version -s)"
          echo "Tag: $TAG   pyproject: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$PKG'." \
                 "Bump the version, commit, then tag the same version." >&2
            exit 1
          fi

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
